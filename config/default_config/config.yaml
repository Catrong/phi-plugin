#  ************ 【渲染设置】 *************
#  渲染器 puppeteer: 插件独立浏览器；shotium: 复用 Yunzai 宿主 Shotium，保存后动态生效
renderer: puppeteer

#  渲染精细度，可选值50~200，建议100。设置高精度会提高图片的精细度，但因图片较大可能会影响渲染与发送速度
renderScale: 100

#  JPEG/WebP 渲染质量，可选值1~100，越高细节越清晰、图片越大；动态生效，PNG 不受影响
randerQuality: 100

#  渲染超时时间 ms
timeout: 20000

#  等待渲染超时时间 ms
waitingTimeout: 10000

#  等待渲染的队列上限，不含正在渲染的请求；0 为不排队，修改后立即生效
renderQueueLimit: 32

#  插件渲染队列的并发上限，修改后动态生效；Shotium 复用宿主，不按此数量启动浏览器
renderNum: 1

#  每页最大渲染评论数量
commentsAPage: 10

#  b19最大成绩数量
B19MaxNum: 50

#  历史成绩单日数量，至少为2
HistoryDayNum: 10

#  历史成绩总数量
HistoryScoreNum: 50

#  历史成绩展示天数
HistoryScoreDate: 10

#  /list 最大渲染成绩数量
listScoreMaxNum: 180

#  ************ 【系统设置】 *************

#  默认使用国际服
defaultGlobal: false

#  是否监听信息文件变化（按文件粒度只重载受影响的曲目数据），如遇监听文件超限请尝试关闭
watchInfoPath: false

#  是否开启曲目评论功能，该功能目前暂无敏感词校验
allowComment: true

#  是否开启谱面标签功能，该功能目前暂无敏感词校验
allowChartTag: false

#  在线曲绘地址
onLinePhiIllUrl: 1
#  1: GitHub raw
#  2: Gitee raw
#  3: 弦塔资源站
#  4: cnb.cool

#  下载曲绘地址
downIllUrl: "https://github.com/Catrong/phi-plugin-ill.git"

#  GitHub代理地址，仅在在线曲绘地址使用 GitHub raw 或下载曲绘地址使用 GitHub 时生效
#  填 false 为不使用代理，也可直接填写代理地址，如 "https://gh-proxy.com"
githubProxy: "https://gh-proxy.com"

#  是否在更新插件时自动拉取最新曲绘
autoPullPhiIll: false

#  是否开启频道模式（文字版仅限私聊，关闭文字版图片，文字版将折叠为一条消息，把@改为回复）
isGuild: false

#  文字版b19是否带图，关闭可以节约大量发送时间
WordB19Img: false

#  文字版suggest是否带图，关闭可以节约大量发送时间
WordSuggImg: false

#  登录TapTap绑定是否发送二维码
TapTapLoginQRcode: true

#  绑定流程精简回复，开启后仅发送二维码、绑定成功提示、成绩更新图与API不可用提示，避免官方Bot被动回复超出条数限制
SimpleBindReply: false

#  图片与文本/Markdown/按钮消息是否合并为一条发送
#  关闭时：图片+文本+Markdown/按钮 会先单独发送图片，再发送文本与Markdown/按钮；图片+纯文本仍合并发送
MergeImageWithText: false

#  快捷操作消息发送方式：off 关闭 / markdown 使用 md / button 使用按钮（按钮需要 QQ 官方机器人支持）
LetterMarkdown: "markdown"

#  命令头
cmdhead: "phi"

#  是否启用Phigros联合查分API
openPhiPluginApi: true

# 是否允许从 API 获取和安装自定义主题（受上方总开关控制）
enableCustomThemeApi: true

# 是否允许调用无需用户认证的查分统计与谱面分析接口（受上方总开关控制）
enableScoreStatisticsApi: true

# 是否允许调用需要用户认证的在线查分接口（受上方总开关和用户个人 API 开关控制）
enableOnlineScoreApi: true

# 是否开启 Bot 状态与正式别名同步定时任务（心跳、消息拉取与正式别名快照下载，受上方 API 总开关控制）
enableAliasSyncTask: true

# 同步任务执行周期（cron 表达式，6 位含秒，如 0 * * * * ? 为每分钟），修改后重载插件生效
aliasSyncTaskCron: "0 * * * * ?"

# 是否打印同步任务每次触发的执行日志（开始处理/完成），关闭后仅保留异常日志
aliasSyncTaskLog: false

# 主题市场临时下载链接允许的唯一来源。必须为 HTTPS origin，不含路径。
themeMarketDownloadOrigin: "https://lyh.org.cn:18473"

# 由查分 API 签发，也可在管理表单中修改；客户端 ID、密钥和版本号须保持匹配。
apiBotClientId: ""
apiBotClientSecret: ""
apiBotSecretVersion: 0

#  输出测试日志
debug: 0

#  谱面文件路径
chartPath: ''

#  多个曲目回复序号等待时长(s)
mutiNickWaitTimeOut: 10

#  ************ 【娱乐设置】 *************
#  是否启用额外曲库 0:原本 1:原本+额外 2:仅额外
otherinfo: 0

#  ************ 【猜字母设置】 *************
#  猜字母条数
LetterNum: 8

#  开字母消息格式：text 仅文本 / markdown 仅 md
LetterMessageMode: "markdown"

#  猜对后是否发送以及发送什么曲绘 原版 水印版 不发送
LetterIllustration: "水印版"

#  猜字母群聊全局猜测冷却时间间隔(s)
LetterGuessCd: 0

#  猜字母群聊全局翻开字母冷却时间间隔(s)
LetterRevealCd: 0

#  猜字母群聊全局提示冷却时间间隔(s)
LetterTipCd: 0

#  猜字母待机时长(s)
LetterTimeLength: 300

#  ************ 【猜曲绘设置】 *************
#  猜曲绘是否撤回
GuessTipRecall: false

#  猜曲绘提示时间间隔(s)
GuessTipCd: 15

#  未通过 -l 指定难度时使用的干扰难度 -1:随机 0:无干扰 1:单一干扰 2:双重干扰 3:高难干扰
GuessTipDefaultLevel: -1

#  追加提示是否包含曲目所属章节
GuessTipChapter: true

#  追加提示是否包含曲目 BPM
GuessTipBpm: true

#  追加提示是否包含曲目作者（曲师），部分曲师名会直接点明曲目，可按需关闭
GuessTipComposer: true

#  追加提示是否包含曲目时长
GuessTipLength: true

#  追加提示是否包含曲绘画师
GuessTipIllustrator: true

#  追加提示是否包含谱面定数
GuessTipChartDifficulty: true

#  追加提示是否包含谱面物量
GuessTipChartCombo: true

#  追加提示是否包含谱师，特色谱师名会直接点明曲目，建议关闭
GuessTipChartCharter: true

#  ************ 【提示猜歌设置】 *************
#  提示猜歌提示的冷却时间间隔(s)
GuessTipsTipCD: 5

#  提示猜歌的提示条数（除曲绘外）
GuessTipsTipNum: 6

#  提示猜歌超时时长(s)
GuessTipsTimeout: 600

#  发送曲绘后多久公布答案(s)
GuessTipsAnsTime: 30

#  ************ 【弗一把设置】 *************
#  按参与人数对应的可猜次数，从 1 人起依次填写，用英文逗号分隔；
#  参与人数超过表的长度时取最后一个值，非法值会被忽略
FribGuessNumTable: "8,9,10,12,14,17,20"

#  待机超时时长(s)，超时自动公布答案
FribTimeout: 600

#  个人回答冷却时间(s)，同一人在群里的连续回答间隔
FribSelfGuessCd: 3

#  群内回答冷却时间(s)，本群所有人共享的回答间隔
FribGroupGuessCd: 0

#  默认分档难度 EZ HD IN AT
FribDefaultLevel: "IN"

#  版本相近范围（前后几代）
FribNearVersion: 2

#  定数相近范围
FribNearDifficulty: 0.3

#  BPM相近范围
FribNearBpm: 20

#  物量相近范围
FribNearCombo: 200

#  ************ 【猜RKS设置】 *************
#  猜中判定容差：猜测值与 B30 计算 rks 相差不超过该值即算猜对
GrksTolerance: 0.1

#  匹配模式要求的最少有效成绩条数（B30 数据完整度）
GrksMinRecord: 27

#  单局满分，实际得分 = 满分 / 提示条数
GrksMaxScore: 10

#  单机模式第几条提示后公开成绩位置
GrksPositionHintAt: 5

#  单机每次成绩提示新公开的成绩条数
GrksHintRevealNum: 2

#  单机提示冷却时间(s)
GrksTipCd: 3

#  单机回答与提示共用冷却(s)：回答按玩家独立计算，提示按房间独立计算
GrksSoloCd: 5

#  单机待机超时时长(s)，超时自动公布答案
GrksTimeLength: 600

#  单机允许猜错次数，0 为不限制
GrksWrongLimit: 0

#  统计提示的默认形式：auto 随机 / histogram 条形图 / range 上下界（玩家可临时指定）
GrksStatsHint: "auto"

#  出题池缓存有效期(h)，0 为每次都重新扫描
GrksPoolRefreshHours: 6

#  匹配提示、回答阶段各自的行动时限(s)，切换阶段后重新计时
GrksMatchTurnTime: 90

#  ************ 【其他设置】 *************
#  认证 Token
VikaToken: ""

